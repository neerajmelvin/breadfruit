<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a2e">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Breadfruit Classifier</title>
<style>
  :root { --bg:#0f1a2e; --card:#1b2a4a; --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --border:#1e3a5f; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  main { max-width:560px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:1.4rem; margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 18px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  .btns { display:flex; gap:10px; }
  button, label.btn { flex:1; text-align:center; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:13px 10px; font-size:1rem; font-weight:600; cursor:pointer; }
  label.btn.alt { background:#2b3f66; }
  button:disabled { opacity:.45; cursor:default; }
  input[type=file] { display:none; }
  .preview { position:relative; margin-top:14px; display:none; }
  .preview canvas { width:100%; border-radius:10px; display:block; background:#000; }
  .toggle { display:flex; align-items:center; gap:8px; margin-top:10px; color:var(--muted); font-size:.9rem; }
  .row { display:flex; gap:12px; }
  .row > div { flex:1; }
  .lbl { color:var(--muted); font-size:.8rem; text-transform:uppercase; letter-spacing:.05em; }
  .val { font-size:1.25rem; font-weight:700; margin:2px 0 8px; text-transform:capitalize; }
  .bar { height:8px; background:#12203a; border-radius:5px; overflow:hidden; margin:3px 0 7px; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .small { font-size:.8rem; color:var(--muted); display:flex; justify-content:space-between; text-transform:capitalize; }
  .err { color:#fecaca; background:#450a0a; border:1px solid #7f1d1d; border-radius:10px; padding:12px; display:none; margin-bottom:14px; }
  #status { color:var(--muted); text-align:center; margin:8px 0; min-height:1.4em; }
</style>
</head>
<body>
<main>
  <h1>Breadfruit Classifier</h1>
  <p class="sub">Photograph a breadfruit to get its maturity and quality, with a heatmap of what the model looked at.</p>

  <div class="card">
    <div class="btns">
      <label class="btn">Take photo<input id="cam" type="file" accept="image/*" capture="environment"></label>
      <label class="btn alt">Choose image<input id="pick" type="file" accept="image/*"></label>
    </div>
    <div class="preview" id="preview">
      <canvas id="canvas"></canvas>
      <label class="toggle"><input type="checkbox" id="showHeat" checked> Show heatmap for
        <select id="task"><option value="maturity">maturity</option><option value="quality">quality</option></select>
      </label>
    </div>
  </div>

  <button id="go" disabled style="width:100%">Classify</button>
  <div id="status"></div>
  <div class="err" id="err"></div>

  <div class="card" id="results" style="display:none">
    <div class="row">
      <div><div class="lbl">Maturity</div><div class="val" id="mPred"></div><div class="lbl">Confidence</div><div class="val" id="mConf"></div></div>
      <div><div class="lbl">Quality</div><div class="val" id="qPred"></div><div class="lbl">Confidence</div><div class="val" id="qConf"></div></div>
    </div>
    <div class="row">
      <div id="mProbs"></div>
      <div id="qProbs"></div>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
let photo = null;      // downscaled canvas of the chosen image
let blob = null;       // JPEG sent to the API
let result = null;

// Vercel functions accept ~4.5 MB bodies, so shrink phone photos before upload.
async function loadImage(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const s = Math.min(1, 1024 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  photo = c;
  blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
  result = null;
  $('results').style.display = 'none';
  $('err').style.display = 'none';
  $('preview').style.display = 'block';
  $('go').disabled = false;
  draw();
}

for (const id of ['cam', 'pick']) {
  $(id).addEventListener('change', async e => {
    const f = e.target.files[0];
    if (!f) return;
    try { await loadImage(f); } catch (x) { showError('Could not read that image.'); }
    e.target.value = '';
  });
}

// jet-like colormap
function jet(v) {
  const r = Math.min(1, Math.max(0, 1.5 - Math.abs(4 * v - 3)));
  const g = Math.min(1, Math.max(0, 1.5 - Math.abs(4 * v - 2)));
  const b = Math.min(1, Math.max(0, 1.5 - Math.abs(4 * v - 1)));
  return [r * 255, g * 255, b * 255];
}

function draw() {
  if (!photo) return;
  const cv = $('canvas');
  cv.width = photo.width; cv.height = photo.height;
  const ctx = cv.getContext('2d');
  ctx.drawImage(photo, 0, 0);
  if (!result || !$('showHeat').checked) return;
  // The model sees the whole image squashed to 224x224, so the 7x7 map spans the full frame.
  const map = result[$('task').value].grad_cam, n = map.length;
  const small = document.createElement('canvas');
  small.width = n; small.height = n;
  const sctx = small.getContext('2d'), img = sctx.createImageData(n, n);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const [r, g, b] = jet(map[y][x]), i = (y * n + x) * 4;
    img.data.set([r, g, b, 255], i);
  }
  sctx.putImageData(img, 0, 0);
  ctx.globalAlpha = 0.45;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(small, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1;
}
$('showHeat').addEventListener('change', draw);
$('task').addEventListener('change', draw);

function probs(el, obj) {
  el.innerHTML = Object.entries(obj).map(([k, v]) =>
    `<div class="small"><span>${k.replace(/_/g, ' ')}</span><span>${(v * 100).toFixed(1)}%</span></div><div class="bar"><i style="width:${v * 100}%"></i></div>`).join('');
}

function showError(msg) { const e = $('err'); e.textContent = msg; e.style.display = 'block'; }

$('go').addEventListener('click', async () => {
  if (!blob) return;
  $('go').disabled = true; $('status').textContent = 'Classifying…'; $('err').style.display = 'none';
  try {
    const fd = new FormData();
    fd.append('file', blob, 'photo.jpg');
    const res = await fetch('/api/predict', { method: 'POST', body: fd });
    const data = await res.json();
    if (!res.ok || data.status !== 'success') throw new Error(data.error || data.detail || ('HTTP ' + res.status));
    result = data;
    const fmt = s => s.replace(/_/g, ' ');
    $('mPred').textContent = fmt(data.maturity.prediction);
    $('mConf').textContent = (data.maturity.confidence * 100).toFixed(1) + '%';
    $('qPred').textContent = fmt(data.quality.prediction);
    $('qConf').textContent = (data.quality.confidence * 100).toFixed(1) + '%';
    probs($('mProbs'), data.maturity.probabilities);
    probs($('qProbs'), data.quality.probabilities);
    $('results').style.display = 'block';
    draw();
  } catch (e) {
    showError('Request failed: ' + e.message);
  } finally {
    $('status').textContent = ''; $('go').disabled = false;
  }
});
</script>
</body>
</html>
